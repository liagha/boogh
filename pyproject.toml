[project]
name = "boogh"
version = "0.1.0"
description = "Snapp ride + SnappFood CLI"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
boogh = "boogh.cli:main"
boogh-mcp = "boogh.mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boogh"]
